<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - IFFar ADM</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      display: flex;
      background: #f4f9f4;
      height: 100vh;
      color: #1b5e20;
    }

    aside.sidebar {
      width: 250px;
      background: #2e7d32;
      color: #fff;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 6px rgba(0, 0, 0, 0.1);
    }

    aside.sidebar .logo {
      text-align: center;
      padding: 25px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      background: #d0f0c0;
    }

    aside.sidebar .logo img {
      width: 100px;
      margin-bottom: 12px;
    }

    aside.sidebar .logo h2 {
      margin: 0;
      font-size: 22px;
      color: #2e7d32;
    }

    aside.sidebar nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    aside.sidebar nav ul li a {
      display: block;
      padding: 18px 25px;
      color: #c8e6c9;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      transition: background 0.3s, color 0.3s;
    }

    aside.sidebar nav ul li a.active,
    aside.sidebar nav ul li a:hover {
      background: #1b5e20;
      color: #fff;
    }

    main {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    h1 {
      color: #2e7d32;
      margin-bottom: 30px;
      font-size: 32px;
    }

    h2 {
      font-size: 24px;
      margin-bottom: 15px;
    }

    .section-box {
      background: #e8f5e9;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 30px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .count-box {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }

    .count-card {
      flex: 1;
      background: #dff0d8;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #1b5e20;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
    }

    #news-list a,
    #announcement-list a {
      display: block;
      background: #dff0d8;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
      text-decoration: none;
      color: #1b5e20;
      transition: transform 0.2s;
      width: 80%;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    #news-list a:hover,
    #announcement-list a:hover {
      transform: scale(1.02);
    }

    .news-banner {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .section-box a p {
      margin: 0;
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>

<body>
  <aside class="sidebar">
    <div class="logo"><img src="/img/logo.jpeg" alt="Logo">
      <h2>IFFar ADM</h2>
    </div>
    <nav>
      <ul>
        <li><a href="/admin/home" class="active">🏠 Home</a></li>
        <li><a href="/admin/responsibles">👨‍🏫 Responsáveis</a></li>
        <li><a href="/admin/sectors">🏢 Setores</a></li>
        <li><a href="/admin/informations">ℹ️ Informações</a></li>
      </ul>
    </nav>
  </aside>

  <main>
    <h1>Bem-vindo ao IFFar ADM!</h1>

    <div class="count-box">
      <div class="count-card" id="count-responsibles">Responsáveis: ...</div>
      <div class="count-card" id="count-sectors">Setores: ...</div>
      <div class="count-card" id="count-informations">Informações: ...</div>
    </div>

    <div class="section-box">
      <h2>Últimas Notícias</h2>
      <div class="horizontal-scroll" id="news-list"></div>
    </div>
    <div class="section-box">
      <h2>Últimos Editais</h2>
      <div class="horizontal-scroll" id="announcement-list"></div>
    </div>
  </main>

  <script>
    const newsApi = "http://localhost:8080/news";
    const announcementsApi = "http://localhost:8080/announcements";

    const countSectorsApi = "http://localhost:8080/sectors/count";
    const countInformationsApi = "http://localhost:8080/informations/count";
    const countResponsiblesApi = "http://localhost:8080/responsibles/count";

    function loadCounts() {
      fetch(countSectorsApi).then(r => r.json()).then(c => document.getElementById("count-sectors").innerText = `Setores: ${c}`);
      fetch(countInformationsApi).then(r => r.json()).then(c => document.getElementById("count-informations").innerText = `Informações: ${c}`);
      fetch(countResponsiblesApi).then(r => r.json()).then(c => document.getElementById("count-responsibles").innerText = `Responsáveis: ${c}`);
    }

    function loadNews() {
      fetch(newsApi).then(r => r.json()).then(data => {
        const list = document.getElementById("news-list");
        list.innerHTML = "";
        (Array.isArray(data) ? data : []).forEach(item => {
          const div = document.createElement("div");
          div.innerHTML = `<a href="${item.link}" target="_blank"><img src="${item.banner}" class="news-banner"><p>${item.title}</p></a>`;
          list.appendChild(div);
        });
      });
    }

    function loadAnnouncements() {
      fetch(announcementsApi).then(r => r.json()).then(data => {
        const list = document.getElementById("announcement-list");
        list.innerHTML = "";
        (Array.isArray(data) ? data : []).forEach(item => {
          const div = document.createElement("div");
          div.innerHTML = `<a href="${item.link}" target="_blank"><p>${item.title}</p></a>`;
          list.appendChild(div);
        });
      });
    }

    loadCounts();
    loadNews();
    loadAnnouncements();
  </script>
</body>

</html>
