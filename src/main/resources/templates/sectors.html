<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Setores - IFFar ADM</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      display: flex;
      background: #f4f9f4;
      color: #1b5e20;
      min-height: 100vh;
    }

    aside.sidebar {
      width: 250px;
      background: #2e7d32;
      color: #fff;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 6px rgba(0, 0, 0, 0.1);
    }

    aside.sidebar .logo {
      text-align: center;
      padding: 25px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      background: #d0f0c0;
    }

    aside.sidebar .logo img {
      width: 100px;
      margin-bottom: 12px;
    }

    aside.sidebar .logo h2 {
      margin: 0;
      font-size: 22px;
      color: #2e7d32;
    }

    aside.sidebar nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    aside.sidebar nav ul li a {
      display: block;
      padding: 18px 25px;
      color: #c8e6c9;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      transition: background 0.3s, color 0.3s;
    }

    aside.sidebar nav ul li a.active,
    aside.sidebar nav ul li a:hover {
      background: #1b5e20;
      color: #fff;
    }

    main {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    h1 {
      color: #2e7d32;
      margin-bottom: 30px;
      font-size: 32px;
    }

    .section-box {
      background: #e8f5e9;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 30px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .tabs {
      margin-bottom: 20px;
    }

    .tab-btn {
      padding: 10px 20px;
      background: #c8e6c9;
      border: none;
      cursor: pointer;
      font-weight: bold;
      border-radius: 8px 8px 0 0;
      margin-right: 5px;
    }

    .tab-btn.active {
      background: #2e7d32;
      color: #fff;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 15px;
    }

    th, td {
      border-bottom: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #c8e6c9;
      font-weight: bold;
    }

    tr:hover {
      background: #f1f8e9;
    }

    .accordion-panel {
      background: #f9fff9;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 10px;
      display: none;
    }

    .accordion-row {
      cursor: pointer;
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    input, select, textarea {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      width: 60%;
      max-width: 400px;
      font-size: 16px;
      transition: border 0.3s, box-shadow 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #2e7d32;
      box-shadow: 0 0 5px rgba(46, 125, 50, 0.5);
    }

    button {
      padding: 12px 20px;
      background: #2e7d32;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s, transform 0.2s;
    }

    button:hover {
      background: #1b5e20;
      transform: scale(1.02);
    }

    button.delete {
      background: #e57373;
    }

    .hours-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    .hours-table td {
      padding: 10px;
      vertical-align: top;
    }

    .day-cell {
      background: #f1fdf1;
      border-radius: 10px;
      padding: 10px;
    }

    .time-period {
      display: flex;
      gap: 5px;
      align-items: center;
      margin-bottom: 5px;
    }

    .add-period-btn, .remove-period-btn {
      padding: 4px 8px;
      font-size: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: #fff;
    }

    .add-period-btn { background: #4caf50; }
    .remove-period-btn { background: #e57373; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo">
      <img src="/img/logo.jpeg" alt="Logo" />
      <h2>IFFar ADM</h2>
    </div>
    <nav>
      <ul>
        <li><a href="/admin/home">🏠 Home</a></li>
        <li><a href="/admin/responsibles">👨‍🏫 Responsáveis</a></li>
        <li><a href="/admin/sectors" class="active">🏢 Setores</a></li>
        <li><a href="/admin/informations">ℹ️ Informações</a></li>
      </ul>
    </nav>
  </aside>

  <main>
    <h1>Gestão de Setores</h1>

    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('view')">Visualizar</button>
      <button class="tab-btn" onclick="showTab('form')">Adicionar Setor</button>
    </div>

    <div id="view" class="tab-content active">
      <div class="section-box">
        <h2>Lista de Setores</h2>
        <table>
          <thead>
            <tr>
              <th>Sigla</th>
              <th>Nome</th>
              <th>Prédio</th>
              <th>Sala</th>
              <th>Responsável</th>
            </tr>
          </thead>
          <tbody id="sectors-list"></tbody>
        </table>
      </div>
    </div>

    <div id="form" class="tab-content">
      <div class="section-box">
        <h2 id="form-title">Adicionar Setor</h2>
        <form id="sector-form">
          <input type="hidden" id="sector-id">
          <input type="text" id="acronym" placeholder="Sigla" required>
          <input type="text" id="name" placeholder="Nome" required>
          <textarea id="desc" placeholder="Descrição"></textarea>
          <input type="text" id="lat" placeholder="Latitude">
          <input type="text" id="longi" placeholder="Longitude">
          <input type="text" id="build" placeholder="Prédio">
          <input type="text" id="room" placeholder="Sala">
          <select id="responsible"></select>

          <h3>Horários de Funcionamento</h3>
          <table class="hours-table" id="hours-container"></table>

          <button type="submit">Salvar Setor</button>
          <button type="button" id="cancel-btn">Cancelar</button>
        </form>
      </div>
    </div>
  </main>

  <script>
    const apiUrl = "http://localhost:8080/sectors";
    const respApi = "http://localhost:8080/responsibles";
    const form = document.getElementById("sector-form");
    const idInput = document.getElementById("sector-id");
    const acronymInput = document.getElementById("acronym");
    const nameInput = document.getElementById("name");
    const descInput = document.getElementById("desc");
    const latInput = document.getElementById("lat");
    const longInput = document.getElementById("longi");
    const buildInput = document.getElementById("build");
    const roomInput = document.getElementById("room");
    const responsibleSelect = document.getElementById("responsible");
    const cancelBtn = document.getElementById("cancel-btn");
    const sectorsList = document.getElementById("sectors-list");
    const hoursContainer = document.getElementById("hours-container");
    const days = ["Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado", "Domingo"];

    function showTab(tab) {
      document.querySelectorAll(".tab-content").forEach(tc => tc.classList.remove("active"));
      document.getElementById(tab).classList.add("active");
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
      document.querySelector(`.tab-btn[onclick="showTab('${tab}')"]`).classList.add("active");
    }

    function loadResponsibles() {
      fetch(respApi)
        .then(r => r.json())
        .then(data => {
          responsibleSelect.innerHTML = "<option value=''>Selecione o responsável</option>";
          data.forEach(r => {
            const opt = document.createElement("option");
            opt.value = r.id;
            opt.textContent = r.name;
            responsibleSelect.appendChild(opt);
          });
        });
    }

    function createHoursInputs(periods = {}) {
      hoursContainer.innerHTML = "";
      const layout = [
        ["Segunda", "Terça", "Quarta"],
        ["Quinta", "Sexta", "Sábado"],
        ["Domingo"]
      ];
      layout.forEach(rowDays => {
        const tr = document.createElement("tr");
        rowDays.forEach(day => {
          const td = document.createElement("td");
          td.className = "day-cell";
          const dayDiv = document.createElement("div");
          dayDiv.innerHTML = `<strong>${day}</strong><br>`;

          const existing = periods[day] || [];
          existing.forEach(p => addPeriodRow(dayDiv, day, p.open, p.close));

          const addBtn = document.createElement("button");
          addBtn.type = "button";
          addBtn.textContent = "+ Adicionar horário";
          addBtn.className = "add-period-btn";
          addBtn.addEventListener("click", () => addPeriodRow(dayDiv, day));
          dayDiv.appendChild(addBtn);

          td.appendChild(dayDiv);
          tr.appendChild(td);
        });
        hoursContainer.appendChild(tr);
      });
    }

    function addPeriodRow(container, day, openVal = "", closeVal = "") {
      const row = document.createElement("div");
      row.className = "time-period";
      row.innerHTML = `
        <input type="time" class="open" data-day="${day}" value="${openVal}">
        <input type="time" class="close" data-day="${day}" value="${closeVal}">
        <button type="button" class="remove-period-btn">-</button>
      `;
      row.querySelector(".remove-period-btn").addEventListener("click", () => row.remove());
      container.insertBefore(row, container.querySelector(".add-period-btn"));
    }

    function loadSectors() {
      fetch(apiUrl)
        .then(r => r.json())
        .then(data => {
          sectorsList.innerHTML = "";
          data.forEach(s => {
            const tr = document.createElement("tr");
            tr.className = "accordion-row";
            tr.innerHTML = `
              <td>${s.acronym}</td>
              <td>${s.name}</td>
              <td>${s.build || ""}</td>
              <td>${s.room || ""}</td>
              <td>${s.responsible?.name || ""}</td>`;
            const panel = document.createElement("tr");
            const panelTd = document.createElement("td");
            panelTd.colSpan = 5;
            const desc = s.description || "Sem descrição.";
            let hoursHtml = "<strong>Horários:</strong><br>";
            if (s.operatingHours?.days) {
              for (const day of days) {
                const dayPeriods = s.operatingHours.days[day] || [];
                hoursHtml += `<p>${day}: ${dayPeriods.length ? dayPeriods.map(p => `${p.open} - ${p.close}`).join(", ") : "Fechado"}</p>`;
              }
            } else {
              hoursHtml += "<p>Sem horários cadastrados.</p>";
            }
            panelTd.innerHTML = `
              <div class="accordion-panel">
                <p><strong>Descrição:</strong> ${desc}</p>
                ${hoursHtml}
                <button onclick="editSector(${s.id})">Editar</button>
                <button class="delete" onclick="deleteSector(${s.id})">Excluir</button>
              </div>`;
            panel.appendChild(panelTd);
            sectorsList.appendChild(tr);
            sectorsList.appendChild(panel);

            tr.addEventListener("click", () => {
              const panelDiv = panelTd.querySelector(".accordion-panel");
              const isVisible = panelDiv.style.display === "block";
              document.querySelectorAll(".accordion-panel").forEach(p => (p.style.display = "none"));
              panelDiv.style.display = isVisible ? "none" : "block";
            });
          });
        });
    }

    function editSector(id) {
      fetch(`${apiUrl}/${id}`)
        .then(r => r.json())
        .then(s => {
          idInput.value = s.id;
          acronymInput.value = s.acronym;
          nameInput.value = s.name;
          descInput.value = s.description;
          latInput.value = s.lat;
          longInput.value = s.longi;
          buildInput.value = s.build;
          roomInput.value = s.room;
          responsibleSelect.value = s.responsible?.id || "";
          createHoursInputs(s.operatingHours?.days);
          showTab("form");
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
    }

    form.addEventListener("submit", e => {
      e.preventDefault();
      const periods = {};
      document.querySelectorAll(".open").forEach(open => {
        const day = open.dataset.day;
        const close = open.parentElement.querySelector(".close").value;
        if (!periods[day]) periods[day] = [];
        if (open.value && close) periods[day].push({ open: open.value, close });
      });
      const payload = {
        acronym: acronymInput.value,
        name: nameInput.value,
        description: descInput.value,
        lat: latInput.value,
        longi: longInput.value,
        build: buildInput.value,
        room: roomInput.value,
        responsibleId: responsibleSelect.value,
        operatingHours: { days: periods }
      };
      const method = idInput.value ? "PUT" : "POST";
      const url = idInput.value ? `${apiUrl}/${idInput.value}` : apiUrl;
      fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(() => {
        form.reset();
        createHoursInputs();
        idInput.value = "";
        loadSectors();
        showTab("view");
      });
    });

    cancelBtn.addEventListener("click", () => {
      form.reset();
      createHoursInputs();
      idInput.value = "";
      showTab("view");
    });

    function deleteSector(id) {
      if (confirm("Deseja realmente excluir este setor?")) {
        fetch(`${apiUrl}/${id}`, { method: "DELETE" }).then(() => loadSectors());
      }
    }

    loadResponsibles();
    createHoursInputs();
    loadSectors();
  </script>
</body>
</html>
